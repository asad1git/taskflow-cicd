name: CI – Build & Push Docker Image

# ─────────────────────────────────────────────────────────────────
# Trigger: fires on every Pull Request targeting the "develop" branch
# ─────────────────────────────────────────────────────────────────
on:
  pull_request:
    branches:
      - develop

jobs:
  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      # Step 1 – Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2 – Authenticate with Docker Hub
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3 – Build the Docker image from the Dockerfile in repo root
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/taskflow:latest .

      # Step 4 – Tag image with short commit SHA as well
      - name: Tag Image with Commit SHA
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/taskflow:latest \
                     ${{ secrets.DOCKERHUB_USERNAME }}/taskflow:$SHORT_SHA
          echo "Tagged as: ${{ secrets.DOCKERHUB_USERNAME }}/taskflow:$SHORT_SHA"

      # Step 5 – Push both tags to Docker Hub
      - name: Push Docker Image to Docker Hub
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/taskflow:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/taskflow:$SHORT_SHA
          echo "✅ Image pushed successfully with tags: latest, $SHORT_SHA"
